services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart-leads-dashboard
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - mongodb
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongodb_data:
